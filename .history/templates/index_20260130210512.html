<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oracle CRUD Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #f8fafc;
      }
      .glass {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
      }
      .transition-all {
        transition: all 0.3s ease;
      }
    </style>
  </head>
  <body class="p-8">
    <div class="max-w-6xl mx-auto">
      <!-- Header -->
      <header class="mb-10 flex justify-between items-center">
        <div>
          <h1 class="text-3xl font-bold text-slate-800">Student CRUD</h1>
          <p class="text-slate-500">Oracle Database CRUD Application</p>
        </div>
        <button
          id="btnAddNew"
          class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-lg font-medium transition-all flex items-center gap-2 shadow-lg shadow-indigo-200"
        >
          <i class="fas fa-plus"></i> Add New Student
        </button>
      </header>

      <!-- Stats Card (Optional) -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div
          class="glass p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4"
        >
          <div class="p-3 bg-indigo-50 text-indigo-600 rounded-xl">
            <i class="fas fa-user-graduate text-xl"></i>
          </div>
          <div>
            <p class="text-sm text-slate-500 font-medium">Total Students</p>
            <p id="totalCount" class="text-2xl font-bold text-slate-800">0</p>
          </div>
        </div>
      </div>

      <!-- Students Table -->
      <div
        class="glass rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-200 overflow-hidden"
      >
        <table class="w-full text-left border-collapse">
          <thead class="bg-slate-50/50">
            <tr>
              <th
                class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider"
              >
                ID
              </th>
              <th
                class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider"
              >
                Name
              </th>
              <th
                class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider"
              >
                Email Address
              </th>
              <th
                class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider"
              >
                Course
              </th>
              <th
                class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider text-right"
              >
                Actions
              </th>
            </tr>
          </thead>
          <tbody id="studentTableBody" class="divide-y divide-slate-100">
            <!-- Data will be loaded here via AJAX -->
            <tr>
              <td colspan="5" class="px-6 py-20 text-center">
                <div class="flex flex-col items-center gap-3 text-slate-400">
                  <!-- <i class="fas fa-spinner fa-spin text-2xl"></i> -->

                  <i class="fa-solid fa-spinner fa-spin text-4xl"></i>
                  <p>Loading students from Oracle...</p>
                </div>

                <div class="flex flex-col items-center gap-4 p-10">
                  <span
                    class="material-symbols-outlined animate-spin text-4xl text-red-500"
                  >
                    progress_activity
                  </span>

                  <p class="font-sans text-lg">
                    Loading students from Oracle...
                  </p>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Modal for Adding/Editing -->
    <div
      id="studentModal"
      class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center opacity-0 pointer-events-none transition-all duration-300"
    >
      <div
        class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-8 transform scale-95 transition-all duration-300"
      >
        <div class="flex justify-between items-center mb-6">
          <h3 id="modalTitle" class="text-xl font-bold text-slate-800">
            Add New Student
          </h3>
          <button
            id="btnCloseModal"
            class="text-slate-400 hover:text-slate-600 transition-all"
          >
            <i class="fas fa-times text-xl"></i>
          </button>
        </div>

        <form id="studentForm" class="space-y-5">
          <input type="hidden" id="studentId" />
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5"
              >Full Name</label
            >
            <input
              type="text"
              id="name"
              required
              class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
              placeholder="e.g. Ali Ahmed"
            />
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5"
              >Email Address</label
            >
            <input
              type="email"
              id="email"
              required
              class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
              placeholder="ali@example.com"
            />
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5"
              >Course Name</label
            >
            <input
              type="text"
              id="course"
              class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
              placeholder="e.g. Computer Science"
            />
          </div>

          <div class="flex gap-3 pt-3">
            <button
              type="button"
              id="btnCancel"
              class="flex-1 px-4 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-medium hover:bg-slate-50 transition-all"
            >
              Cancel
            </button>
            <button
              type="submit"
              id="btnSave"
              class="flex-1 px-4 py-2.5 rounded-xl bg-indigo-600 text-white font-medium hover:bg-indigo-700 shadow-lg shadow-indigo-200 transition-all"
            >
              Save Student
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Toast Notifications -->
    <div
      id="toast"
      class="fixed bottom-8 right-8 px-6 py-3 rounded-xl bg-slate-800 text-white shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-3"
    >
      <i id="toastIcon" class="fas fa-check-circle text-emerald-400"></i>
      <p id="toastMessage">Success message here</p>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <!-- <script src="/static/js/app.js"></script> -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

  </body>
</html>
